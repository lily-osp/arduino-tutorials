<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 800 600"><defs><style>.bg{fill:#f8fafc}.box{fill:#1e293b;stroke:#0f172a;stroke-width:3;rx:12px}.btn{fill:#334155;stroke:#475569;cursor:pointer}.btn,.btn-alpha,.btn-func{stroke-width:2;rx:8px}.btn-func{fill:#dc2626;stroke:#b91c1c}.btn-alpha{fill:#2563eb;stroke:#1d4ed8}.header-title{font-weight:700}.pin-label,.text-key{font-family:monospace,sans-serif;font-weight:700}.text-key{fill:#fff;font-size:24px;text-anchor:middle;dominant-baseline:central}.pin-label{font-size:14px}.header-desc,.header-title{font-family:sans-serif}.header-title{font-size:22px;fill:#0f172a}.header-desc{font-size:14px;fill:#475569}.legend-box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:6px}</style></defs><rect width="100%" height="100%" class="bg"/><text x="40" y="45" class="header-title">Skema Matriks &amp; Pinout Keypad 4x4 (16 Tombol / 8 Pin)</text><text x="40" y="72" class="header-desc">Multiplexing 4 Jalur Baris (Row 1-4) dan 4 Jalur Kolom (Col 1-4) dengan Proteksi Anti-Ghosting</text><rect width="340" height="380" x="80" y="110" class="box"/><rect width="60" height="60" x="105" y="135" class="btn"/><text x="135" y="165" class="text-key">1</text><rect width="60" height="60" x="180" y="135" class="btn"/><text x="210" y="165" class="text-key">2</text><rect width="60" height="60" x="255" y="135" class="btn"/><text x="285" y="165" class="text-key">3</text><rect width="60" height="60" x="330" y="135" class="btn-alpha"/><text x="360" y="165" class="text-key">A</text><rect width="60" height="60" x="105" y="220" class="btn"/><text x="135" y="250" class="text-key">4</text><rect width="60" height="60" x="180" y="220" class="btn"/><text x="210" y="250" class="text-key">5</text><rect width="60" height="60" x="255" y="220" class="btn"/><text x="285" y="250" class="text-key">6</text><rect width="60" height="60" x="330" y="220" class="btn-alpha"/><text x="360" y="250" class="text-key">B</text><rect width="60" height="60" x="105" y="305" class="btn"/><text x="135" y="335" class="text-key">7</text><rect width="60" height="60" x="180" y="305" class="btn"/><text x="210" y="335" class="text-key">8</text><rect width="60" height="60" x="255" y="305" class="btn"/><text x="285" y="335" class="text-key">9</text><rect width="60" height="60" x="330" y="305" class="btn-alpha"/><text x="360" y="335" class="text-key">C</text><rect width="60" height="60" x="105" y="390" class="btn-func"/><text x="135" y="420" class="text-key">*</text><rect width="60" height="60" x="180" y="390" class="btn"/><text x="210" y="420" class="text-key">0</text><rect width="60" height="60" x="255" y="390" class="btn-func"/><text x="285" y="420" class="text-key">#</text><rect width="60" height="60" x="330" y="390" class="btn-alpha"/><text x="360" y="420" class="text-key">D</text><path fill="#334155" d="M 120 490 L 120 540 L 380 540 L 380 490 Z"/><g transform="translate(140, 540)"><circle cx="0" cy="15" r="5" fill="#ef4444"/><text x="0" y="35" fill="#ef4444" class="pin-label" text-anchor="middle">R1</text><circle cx="28" cy="15" r="5" fill="#ef4444"/><text x="28" y="35" fill="#ef4444" class="pin-label" text-anchor="middle">R2</text><circle cx="56" cy="15" r="5" fill="#ef4444"/><text x="56" y="35" fill="#ef4444" class="pin-label" text-anchor="middle">R3</text><circle cx="84" cy="15" r="5" fill="#ef4444"/><text x="84" y="35" fill="#ef4444" class="pin-label" text-anchor="middle">R4</text><circle cx="120" cy="15" r="5" fill="#3b82f6"/><text x="120" y="35" fill="#3b82f6" class="pin-label" text-anchor="middle">C1</text><circle cx="148" cy="15" r="5" fill="#3b82f6"/><text x="148" y="35" fill="#3b82f6" class="pin-label" text-anchor="middle">C2</text><circle cx="176" cy="15" r="5" fill="#3b82f6"/><text x="176" y="35" fill="#3b82f6" class="pin-label" text-anchor="middle">C3</text><circle cx="204" cy="15" r="5" fill="#3b82f6"/><text x="204" y="35" fill="#3b82f6" class="pin-label" text-anchor="middle">C4</text></g><g transform="translate(470, 110)"><rect width="290" height="380" x="0" y="0" class="legend-box"/><text x="20" y="35" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="bold">Logika Pemindaian Matriks</text><text x="20" y="70" fill="#334155" font-family="sans-serif" font-size="13"><tspan x="20" fill="#ef4444" dy="0" font-weight="bold">1. Baris (Row 1-4) = OUTPUT</tspan> <tspan x="20" dy="20">Arduino mengatur 1 baris ke LOW</tspan> <tspan x="20" dy="18">secara bergantian (sequential scan).</tspan> <tspan x="20" fill="#3b82f6" dy="35" font-weight="bold">2. Kolom (Col 1-4) = INPUT_PULLUP</tspan> <tspan x="20" dy="20">Semua kolom standby HIGH (5V).</tspan> <tspan x="20" dy="18">Jika tombol ditekan, kolom terkait</tspan> <tspan x="20" dy="18">tertarik menjadi LOW (0V).</tspan> <tspan x="20" fill="#0f172a" dy="35" font-weight="bold">3. Deteksi Koordinat</tspan> <tspan x="20" dy="20">Perpotongan Baris LOW dan Kolom</tspan> <tspan x="20" dy="18">LOW menentukan tombol yang aktif.</tspan></text><rect width="260" height="85" x="15" y="275" fill="#f1f5f9" rx="6"/><text x="25" y="298" fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="bold">Koneksi Default ke Arduino Uno:</text><text x="25" y="320" fill="#ef4444" font-family="monospace" font-size="12">R1-&gt;D9, R2-&gt;D8, R3-&gt;D7, R4-&gt;D6</text><text x="25" y="340" fill="#3b82f6" font-family="monospace" font-size="12">C1-&gt;D5, C2-&gt;D4, C3-&gt;D3, C4-&gt;D2</text></g></svg>